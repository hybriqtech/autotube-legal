<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>autotube - Authorization</title>
</head>
<body>
  <h1>Authorization</h1>
  <p id="msg">Reading the authorization result...</p>
  <p><code id="code"></code></p>
  <p>Paste this code in the autotube terminal. It is never sent anywhere from this page.</p>
  <script>
    const p = new URLSearchParams(location.search);
    const msg = document.getElementById("msg");
    if (p.get("code")) {
      msg.textContent = "Authorization code (state: " + (p.get("state") || "none") + "):";
      document.getElementById("code").textContent = p.get("code");
    } else {
      msg.textContent = "No code received: " + (p.get("error_description") || p.get("error") || "unknown error");
    }
  </script>
</body>
</html>
